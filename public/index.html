<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5" />
  <title>Profitable Solutions</title>
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="icon" href="/app/icon.svg" />
  <link rel="apple-touch-icon" href="/app/icon.svg" />
  <link rel="stylesheet" href="/app/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Profitable Solutions</div>
    <nav class="tabs">
      <button class="tab is-active" data-view="entry">Order entry</button>
      <button class="tab" data-view="portal">Team portal</button>
    </nav>
  </header>

  <main>
    <!-- ORDER ENTRY -->
    <section id="view-entry" class="view is-active">
      <div class="row">
        <label class="field grow">
          <span>Sale</span>
          <select id="saleSelect" autocomplete="off"></select>
        </label>
        <button id="reloadSales" class="btn ghost" title="Reload open sales">Reload</button>
      </div>

      <div class="row">
        <label class="field grow">
          <span>Buyer name</span>
          <input id="buyerName" type="text" autocomplete="off" placeholder="Type buyer name, Enter to jump to items" />
        </label>
        <label class="field">
          <span>Seller code</span>
          <input id="sellerCode" type="text" autocomplete="off" placeholder="optional" />
        </label>
      </div>

      <div class="row line-entry">
        <label class="field grow">
          <span>SKU code</span>
          <input id="skuCode" type="text" autocomplete="off" placeholder="Type code, Enter" />
          <small id="skuHint" class="hint"></small>
        </label>
        <label class="field qty">
          <span>Qty</span>
          <input id="qty" type="number" min="1" inputmode="numeric" value="1" />
        </label>
        <button id="addLine" class="btn">Add</button>
      </div>

      <table class="lines" id="linesTable" hidden>
        <thead><tr><th>Code</th><th>Product</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Line</th><th></th></tr></thead>
        <tbody id="linesBody"></tbody>
      </table>

      <div class="totalbar">
        <div>Items: <strong id="itemCount">0</strong></div>
        <div class="total">Total: <strong id="orderTotal">$0.00</strong></div>
        <button id="saveOrder" class="btn primary" disabled>Save &amp; next</button>
      </div>

      <details class="ref">
        <summary>Products in this sale</summary>
        <div id="skuRef" class="ref-list"></div>
      </details>

      <div id="toast" class="toast" hidden></div>
    </section>

    <!-- TEAM PORTAL -->
    <section id="view-portal" class="view">
      <div class="row">
        <label class="field grow">
          <span>Team</span>
          <select id="orgSelect" autocomplete="off"></select>
        </label>
      </div>
      <div id="countdown" class="countdown" hidden></div>
      <div class="cards">
        <div class="card">
          <h3>Order history</h3>
          <div id="orderHistory" class="scroll">Pick a sale in Order entry to see its orders.</div>
        </div>
        <div class="card">
          <h3>Customer base</h3>
          <div id="customerBase" class="scroll">Select a team.</div>
        </div>
        <div class="card">
          <h3>Seller leaderboard</h3>
          <div id="leaderboard" class="scroll">Select a team.</div>
        </div>
      </div>
    </section>
  </main>

  <script src="/app/app.js"></script>
</body>
</html>
