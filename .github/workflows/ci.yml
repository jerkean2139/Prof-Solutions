name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a fast follow-up push does not
# queue behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Test the engines floor and the version used in development.
        node: ['20.x', '22.x']

    # The suite runs against a real Postgres and Redis. The database is where
    # the integrity lives, so we do not mock it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: profsol
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profsol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/profsol
      REDIS_URL: redis://localhost:6379
      AUTH_ENFORCED: 'false'
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Compile the production bundle. CI runs the app via tsx, so without this
      # a broken build (wrong emit paths, tests leaking into dist) would ship
      # unnoticed and only fail at `npm start` in production.
      - name: Build (production bundle)
        run: |
          npm run build
          test -f dist/http/server.js || { echo "expected dist/http/server.js"; exit 1; }
          test -f dist/worker.js || { echo "expected dist/worker.js"; exit 1; }

      - name: Apply migrations (smoke the runner)
        run: npm run migrate:up

      - name: Run tests
        run: npm test

  deploy:
    name: deploy (Railway)
    # Only on merge to main, and only after tests pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Inert until RAILWAY_TOKEN is added to repo secrets. With no token this
      # step logs and exits 0, so it never blocks a merge. Once the secret and
      # RAILWAY_SERVICE variable are set, it deploys the merged main.
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set. Skipping deploy."
            echo "Add RAILWAY_TOKEN (repo secret) and RAILWAY_SERVICE (repo variable) to enable CD."
            exit 0
          fi
          npm i -g @railway/cli
          if [ -n "$RAILWAY_SERVICE" ]; then
            railway up --service "$RAILWAY_SERVICE" --detach
          else
            railway up --detach
          fi
